services:
  git-bridge:
    build: .
    container_name: git-bridge
    restart: unless-stopped
    ports:
      - "8011:8080"
    env_file:
      - .env
    volumes:
      # mount projects.json เข้า container (อย่า commit ไฟล์นี้ขึ้น git)
      - ./projects.json:/etc/git-bridge/projects.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
